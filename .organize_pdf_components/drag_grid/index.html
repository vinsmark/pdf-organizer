<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: transparent;
  }
  #grid {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 14px;
    padding: 4px;
  }
  .card {
    border: 2px solid #f43f5e;
    border-radius: 12px;
    background: #fff;
    padding: 8px;
    box-sizing: border-box;
    text-align: center;
    cursor: grab;
    box-shadow: 0 1px 4px rgba(244,63,94,0.1);
    transition: box-shadow 0.15s ease, background-color 0.15s ease, opacity 0.15s ease;
    user-select: none;
  }
  .card:hover {
    box-shadow: 0 6px 18px rgba(244,63,94,0.2);
    background-color: #fff1f2;
  }
  .card.dragging {
    opacity: 0.4;
  }
  .thumb-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .thumb-wrap img {
    max-width: 100%;
    max-height: 100%;
    pointer-events: none;
  }
  .num {
    margin-top: 6px;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    font-weight: 600;
    color: #666;
  }
  #apply-btn {
    margin-top: 14px;
    background-color: #111;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 500;
    padding: 10px 18px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  #apply-btn:hover {
    background-color: #333;
  }
  #status {
    display: inline-block;
    margin-left: 10px;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <div id="grid"></div>
  <button id="apply-btn">Apply order &darr;</button>
  <span id="status"></span>

  <script>
    function sendMessageToStreamlitClient(type, data) {
      var outData = Object.assign({ isStreamlitMessage: true, type: type }, data);
      window.parent.postMessage(outData, "*");
    }
    function componentReady() {
      sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
    }
    function setFrameHeight(height) {
      sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: height });
    }
    function sendValue(value) {
      sendMessageToStreamlitClient("streamlit:setComponentValue", { value: value, dataType: "json" });
    }

    let dragEl = null;

    function renumber() {
      Array.from(document.querySelectorAll('.card')).forEach((c, i) => {
        c.querySelector('.num').textContent = (i + 1);
      });
    }

    function attachDnD() {
      const grid = document.getElementById('grid');
      Array.from(grid.querySelectorAll('.card')).forEach(card => {
        card.addEventListener('dragstart', () => {
          dragEl = card;
          setTimeout(() => card.classList.add('dragging'), 0);
        });
        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          dragEl = null;
          renumber();
          updateHeight();
        });
        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (!dragEl || dragEl === card) return;
          const rect = card.getBoundingClientRect();
          const before = e.clientX < rect.left + rect.width / 2;
          grid.insertBefore(dragEl, before ? card : card.nextSibling);
        });
      });
      grid.addEventListener('dragover', (e) => e.preventDefault());
      grid.addEventListener('drop', (e) => e.preventDefault());
    }

    function updateHeight() {
      requestAnimationFrame(() => {
        setFrameHeight(document.body.scrollHeight + 16);
      });
    }

    function renderGrid(pages, width) {
      const cardWidth = width || 110;
      const cardH = Math.round(cardWidth * 1.3);
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      pages.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.draggable = true;
        card.dataset.page = p.page;
        card.style.width = (cardWidth + 20) + 'px';

        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'thumb-wrap';
        thumbWrap.style.height = cardH + 'px';
        if (p.thumb) {
          const img = document.createElement('img');
          img.src = p.thumb;
          img.draggable = false;
          thumbWrap.appendChild(img);
        }

        const num = document.createElement('div');
        num.className = 'num';

        card.appendChild(thumbWrap);
        card.appendChild(num);
        grid.appendChild(card);
      });
      attachDnD();
      renumber();
      updateHeight();
    }

    document.getElementById('apply-btn').addEventListener('click', () => {
      const cards = Array.from(document.querySelectorAll('.card'));
      const order = cards.map(c => parseInt(c.dataset.page, 10));
      sendValue(order);
      const status = document.getElementById('status');
      status.style.color = '#16a34a';
      status.textContent = 'Order applied \u2713';
      setTimeout(() => { status.textContent = ''; }, 2500);
    });

    window.addEventListener('message', (event) => {
      if (!event.data || event.data.type !== 'streamlit:render') return;
      const args = event.data.args || {};
      renderGrid(args.pages || [], args.thumb_width || 110);
    });

    componentReady();
    setFrameHeight(200);
  </script>
</body>
</html>
